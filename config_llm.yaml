# Expérience : alignement par LLM local (Ollama).
# Lancer (depuis la racine du projet) : python src/run.py config_llm.yaml

name: gemma4_12b_alignement_sur_t

passages:
  - {book: Gen, only: Gen.3}

tokens: w             # w = formes, l = lemmes
greek_accents: true  # true = garder les accents grecs, false = les retirer

aligner: llm          # simalign (défaut) ou llm
llm_model: gemma4:12b # modèle installé dans Ollama
llm_url: http://localhost:11434
