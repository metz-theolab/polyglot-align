# Expérience de référence : LLM local (Ollama) sur le texte, tableau -> liens.
# Lancer (depuis la racine du projet) : python src/run.py experiments/gemma4_texte_gen3_reflexion.yaml

name: gemma4_texte_gen3_reflexion

passages:
  - {book: Gen, only: Gen.3}

tokens: w

aligner: llm
llm_model: gemma4:12b
llm_url: http://localhost:11434
llm_think: true     # true = le modèle « réfléchit » avant de répondre (beaucoup plus lent)
