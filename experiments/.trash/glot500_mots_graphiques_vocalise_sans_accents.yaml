# Expérience de segmentation (DECISIONS.md) : comparer à glot500_formes_sans_accents.
# Lancer (depuis la racine du projet) : python src/run.py experiments/glot500_mots_graphiques_vocalise_sans_accents.yaml

name: glot500_mots_graphiques_vocalise_sans_accents

passages:
  - {book: Gen, only: Gen.1}
  - {book: Gen, only: Gen.3}
  - {book: 1Sam, only: 1Sam.9}

tokens: g                   # w = mots BHSA (בְּ רֵאשִׁית), g = mots graphiques (בְּרֵאשִׁית), l = lemmes
greek_accents: false
hebrew_vocalization: true     # true = voyelles hébraïques gardées

model: cis-lmu/glot500-base
layer: 8
methods: mai          # m = mwmf, a = inter (argmax), i = itermax
device: cpu
