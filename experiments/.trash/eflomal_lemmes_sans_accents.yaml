# eflomal sur les lemmes (DECISIONS.md « Aligneur statistique eflomal »).
# Apprend sur tout le corpus BHSA / LXX, puis évalue les passages ci-dessous.
# Lancer (depuis la racine du projet) : python src/run.py experiments/eflomal_lemmes_sans_accents.yaml

name: eflomal_lemmes_sans_accents

passages:
  - {book: Gen, only: Gen.1}
  - {book: Gen, only: Gen.3}
  - {book: 1Sam, only: 1Sam.9}

aligner: eflomal
tokens: l                   # w = mots BHSA, g = mots graphiques, l = lemmes
greek_accents: false
hebrew_vocalization: false
