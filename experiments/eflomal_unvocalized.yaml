# Toute la Bible, hébreu non vocalisé (consonantique) : eflomal, mots BHSA, grec sans accents.
# Série vocalisé / non vocalisé sur toute la Bible (mbert, xlmr, glot500, eflomal).
# Lancer (depuis la racine du projet) : polyglot-align run experiments/eflomal_unvocalized.yaml

name: eflomal_unvocalized

passages:
  - {book: Gen}
  - {book: Exod}
  - {book: Lev}
  - {book: Num}
  - {book: Deut}
  - {book: Josh}
  - {book: Josh, lxx_book: JoshA}
  - {book: Judg}
  - {book: Judg, lxx_book: JudgA}
  - {book: Ruth}
  - {book: 1Sam}
  - {book: 2Sam}
  - {book: 1Kgs}
  - {book: 2Kgs}
  - {book: 1Chr}
  - {book: 2Chr}
  - {book: Esth}
  - {book: Job}
  - {book: Ps}
  - {book: Prov}
  - {book: Eccl}
  - {book: Song}
  - {book: Isa}
  - {book: Jer}
  - {book: Lam}
  - {book: Ezek}
  - {book: Dan}
  - {book: Dan, lxx_book: DanTh}
  - {book: Hos}
  - {book: Joel}
  - {book: Amos}
  # - {book: Obad}    # exclu : le gold CATSS numérote Abdias en chapitre 0 (aucune paire dans la table)
  - {book: Jonah}
  - {book: Mic}
  - {book: Nah}
  - {book: Hab}
  - {book: Zeph}
  - {book: Hag}
  - {book: Zech}
  - {book: Mal}


aligner: eflomal
tokens: w                   # w = mots BHSA, g = mots graphiques, l = lemmes
greek_accents: false
hebrew_vocalization: false
