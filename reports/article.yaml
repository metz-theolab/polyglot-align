# Rapport pour l'article : tableaux et figures tirés de results/ (aucun alignement relancé).
# Lancer (depuis la racine du projet) : polyglot-align report reports/article.yaml
# Sorties : reports/article/tables/*.tex|md|csv, reports/article/figures/*.pdf|png
#
# Expériences sur toute la Bible (39 livres hébreux, 22 489 paires de versets),
# hébreu vocalisé / non vocalisé (DECISIONS.md « Plan d'expériences pour la publication »).
# Les anciens résultats sur Gen 1, Gen 3, 1 S 9 et le LLM sur Gen 3 sont dans
# results/.trash/ : ils ne sont plus repris ici.

name: article

tables:
  - title: Comparaison des aligneurs (toute la Bible)
    experiments: [mbert_unvocalized, mbert_vocalized,
                  xlmr_unvocalized, xlmr_vocalized,
                  glot500_unvocalized, glot500_vocalized,
                  eflomal_unvocalized, eflomal_vocalized,
                  {name: eflomal_unvocalized, method: gdfa},
                  {name: eflomal_vocalized, method: gdfa}]
    method: inter
    columns: [precision, rappel_blocs, f1, nonalign_exactitude]

  - title: Comparaison des aligneurs, AER (toute la Bible)
    experiments: [mbert_unvocalized, xlmr_unvocalized, glot500_vocalized,
                  eflomal_unvocalized]
    method: inter
    columns: [aer, aer_precision, aer_rappel]

  - title: eflomal par livre (mots BHSA, non vocalisé, inter)
    experiment: eflomal_unvocalized
    rows: passages
    method: inter

  - title: Glot500 par livre (mots BHSA, vocalisé, inter)
    experiment: glot500_vocalized
    rows: passages
    method: inter

figures:
  - figure: precision_rappel
    title: Précision et rappel par blocs (toute la Bible)
    experiments: [mbert_unvocalized, mbert_vocalized,
                  xlmr_unvocalized, xlmr_vocalized,
                  glot500_unvocalized, glot500_vocalized,
                  eflomal_unvocalized, eflomal_vocalized]
  - figure: par_livre
    experiment: eflomal_unvocalized
    method: inter
