# Expérience : LLM local (Ollama) sur le texte (mots graphiques), tableau -> liens.
# Lancer (depuis la racine du projet) : python src/run.py config_llm_gen3.yaml

name: gemma4_12b_texte_gen3

passages:
  - {book: Gen, only: Gen.3}

tokens: w             # couche dont les tokens sont reliés (le LLM voit le texte pointé)

aligner: llm          # simalign (défaut) ou llm
llm_model: gemma4:12b # modèle installé dans Ollama
llm_url: http://localhost:11434
llm_think: true     # true = le modèle « réfléchit » avant de répondre (beaucoup plus lent)
